<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdul Rauf Portfolio</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- AOS Animation -->
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b1020;
    color:white;
    overflow-x:hidden;
}

/* Navbar */
.navbar{
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(15px);
}

.navbar-brand{
    font-size:30px;
    font-weight:700;
    color:white !important;
}

.navbar-brand span{
    color:#c084fc;
}

.nav-link{
    color:white !important;
    margin-left:15px;
}

/* Hero */
.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:100px;
}

.hero h1{
    font-size:60px;
    font-weight:800;
}

.hero h1 span{
    color:#c084fc;
}

.hero p{
    color:#cbd5e1;
    margin-top:20px;
}

.btn-custom{
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#a855f7,#ec4899);
    color:white;
    margin-top:20px;
}

.profile-img{
    width:350px;
    height:350px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid #c084fc;
    box-shadow:0 0 30px rgba(168,85,247,.5);
}

/* Responsive */
@media(max-width:768px){
    .hero{
        text-align:center;
    }

    .hero h1{
        font-size:40px;
    }

    .profile-img{
        width:250px;
        height:250px;
        margin-top:30px;
    }
}

@media(max-width:576px){
    .hero h1{
        font-size:32px;
    }

    .btn-custom{
        width:100%;
    }

    .profile-img{
        width:200px;
        height:200px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
<div class="container">

<a class="navbar-brand" href="#">
Rauf<span>.</span>
</a>

<button class="navbar-toggler bg-light"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarNav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navbarNav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Services</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Portfolio</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Contact</a>
</li>

</ul>

</div>

</div>
</nav>

<!-- Hero Section -->
<section class="hero">

<div class="container">

<div class="row align-items-center">

<div class="col-lg-6" data-aos="fade-right">

<h1>
Hi, I'm <span>Abdul Rauf</span>
</h1>

<h3>Full Stack Developer</h3>

<p>
I create modern responsive websites with beautiful UI,
animations and mobile friendly design.
</p>

<button class="btn-custom">
Hire Me
</button>

</div>

<div class="col-lg-6 text-center" data-aos="fade-left">

<img src="1.jpg" alt="Abdul Rauf" class="profile-img">

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init({
duration:1000
});
</script>

</body>
</html>
